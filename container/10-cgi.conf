# /usr/share/doc/lighttpd/cgi.txt

server.modules += ( "mod_cgi" )

$HTTP["url"] =~ "^/" {
	cgi.assign = ( ".hexi" => "/usr/local/bin/hexi" )
	#alias.url += ( "/" => "/usr/lib/cgi-bin/" )
    index-file.names = ( "index.hexi", "index.html" )
}

